{% include basics %}
{% assign layout = include.layout | default: 'input' %}
{% comment %}<!-- input | full -->{% endcomment %}

<form id="search-form" class="d-flex m-between-1" method="dialog" autocomplete="off" autocapitalize="off">
    <input type="search" id="search" class="form-control {% if layout != 'full' %}w-fix-md{% endif %}" placeholder="{{ const.search.placeholder }}" aria-label="{{ const.search.label }}" spellcheck="false" autocapitalize="off"
           autocomplete="off" required>
    <button id="search-button" class="btn btn-link {% if layout == 'full' %}link-primary{% else %}nav-link{% endif %} border-0 rounded-0 square px-2 py-0" type="submit">
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>
</form>

{% if layout != "full" %}
<script type="module">
    $('#search-form').on('submit', function () {
        const query = $('#search').val();
        if (query.length <= 0) return;
        window.open('{{ relBase }}{{ const.search.url }}#' + query, '_self');
    });
</script>
{% else %}
<script type="module" src="{{ relBase }}/assets/fuse/fuse.min.js"></script>

<div id="search-results" class="mt-5 row justify-content-center g-5"></div>

<script type="text/html-template" id="template_result">
    <a href="%link%" target="%target%" class="d-block">
        <div class="mb-3">
            <h2 class="m-0">
                %title%%linkpostfix%
            </h2>
            <div class="text-muted %class_subtitle%">%subtitle%</div>
        </div>
        <div class="text-dark mb-3 %class_content%">%content%</div>
    </a>
</script>

<script type="module">
    const HIGHLIGHT_CLASS = '{{ const.search.highlight_class | default: "text-primary" }}',
        EXCERPT_LENGTH = parseInt('{{ const.search.excerpt | default: 100000 }}'),
        EXCERPT_HTML = '{% if const.search.excerpt_html %}true{% else %}false{% endif %}' === 'true',
        MATCH_LENGTH_DIFF = '{{ const.search.highlight_match_length_difference | default: "0%" }}';

    let FUSE = null,
        DATA = [];

    $.getJSON('{{ relBase }}{{ const.search.url }}data.json', function (searchData) {
        DATA = searchData;

        FUSE = new Fuse(DATA, {
            includeScore: true,
            includeMatches: true,
            shouldSort: true,

            isCaseSensitive: false,
            ignoreDiacritics: true,

            /**
             * 2 is practical so that everything doesn't crash when you enter something like “a.”
             * 3 is even more robust against unnecessary noise.
             * 4 only if you have a very large amount of data and want to avoid junk hits.
             */
            minMatchCharLength: parseInt('{{ const.search.min_char | default: "2" }}'),
            /**
             * 0 means: exact matches only.
             * 0.6 is the default.
             * 0.2–0.3 is often a good value for “normal” full-text searches: tolerant enough for typos, but not so vague that everything matches.
             * If you want true fuzzy search with many hits (even with significant deviations), go for 0.4–0.5.
             */
            threshold: parseFloat('{{ const.search.threshold | default: "0.6" }}'),

            ignoreLocation: true,
            // location: 0,
            // distance: 100,

            // findAllMatches: false,
            // useExtendedSearch: false,
            // ignoreFieldNorm: false,
            // fieldNormWeight: 1,

            keys: [
                {name: 'title_site', weight: 10},
                {name: 'content_site', weight: 10},

                {name: 'title_post', weight: 5},
                {name: 'content_post', weight: 5},

                {name: 'title_categorylist', weight: 2},
                {name: 'content_categorylist', weight: 2},

                {name: 'title_taglist', weight: 1},
                {name: 'content_taglist', weight: 1},
            ],
        });

        let s = decodeURI(location.hash.substring(1));
        if (JXG.exists(s, true)) {
            $('#search').val(s);
            search();
        }
    }).fail(function (e) {
        console.error(e);
    });

    $('#search').on('input change', function () {
        search();
    });
    $('#search-form').on('submit', function () {
        search();
    });

    // Functions

    function charAt(string, number, ignoreHTML = false) {
        let i, index,
            paused = false;

        if (!ignoreHTML)
            return string.charAt(number);

        index = 0;
        for (i = 0; i < string.length; i++) {
            if (string.charAt(i) === '<' && !paused)
                paused = true;
            if (string.charAt(i - 1) === '>' && paused)
                paused = false;

            if (index === number)
                return string.charAt(i);

            if (!paused)
                index++;
        }

        return undefined;
    }

    function substr(string, start, length, ignoreHTML = false) {
        return substring(string, start, start + length, ignoreHTML);
    }

    function substring(string, start, end, ignoreHTML = false) {
        let i, index,
            paused = false,
            html_start = 0, html_end = string.length;

        if (!ignoreHTML)
            return string.substring(start, end);

        index = 0;
        for (i = 0; i < string.length; i++) {
            if (string.charAt(i) === '<' && !paused)
                paused = true;
            if (string.charAt(i - 1) === '>' && paused)
                paused = false;

            if (index === start)
                html_start = i;
            if (index === end)
                html_end = i;

            if (!paused)
                index++;
        }

        return string.substring(html_start, html_end);
    }

    function generateHighlightedText(inputText, regions, ignoreHTML = false) {
        let content = '';
        let nextUnhighlightedRegionStartingIndex = 0;

        regions.forEach(region => {
            let lastRegionNextIndex = region[1] + 1;

            content += [
                substring(inputText, nextUnhighlightedRegionStartingIndex, region[0], ignoreHTML),
                '<span class="' + HIGHLIGHT_CLASS + '">',
                substring(inputText, region[0], lastRegionNextIndex, ignoreHTML),
                '</span>',
            ].join('');

            nextUnhighlightedRegionStartingIndex = lastRegionNextIndex;
        });

        content += substring(inputText, nextUnhighlightedRegionStartingIndex, undefined, ignoreHTML);

        return content;
    }

    function search(query = undefined) {
        const RES = $('#search-results');

        let result = [];

        query = query || $('#search').val();
        location.hash = '#' + query;
        RES.empty();

        if (query.length < FUSE.options.minMatchCharLength) return;

        try {
            result = FUSE.search(query);
        } catch (e) {
        }

        console.log(result);
        result.forEach(function (result) {
            let item = result.item,
                matches = result.matches,
                indices, index,
                match_threshold = MATCH_LENGTH_DIFF,
                match, firstMatchAt = -1,
                tmp,
                from, to;

            item.title = item['title_' + item.type];
            item.content_plain = item['content_' + item.type];

            item.content = (EXCERPT_HTML ? item.content_light : item.content_plain).trim();

            match_threshold = parseFloat(match_threshold) / (match_threshold.endsWith('%') ? 100 : 1);
            match_threshold = match_threshold * query.length;
            for (match of matches) {
                if (match.key !== 'content_' + item.type)
                    continue;

                indices = [];
                for (index of match.indices) {
                    if ((index[1] - index[0] + 1) >= match_threshold)
                        indices.push(index);
                }

                if (firstMatchAt < 0 && indices.length > 0) {
                    firstMatchAt = indices[0][0];
                }
                item.content = generateHighlightedText(item.content, indices, EXCERPT_HTML);
            }
            if (firstMatchAt < 0) {
                firstMatchAt = 0;
            }

            from = Math.max(firstMatchAt - 5, 0);
            for (from; from >= 0; from--) {
                if (charAt(item.content, from, true) !== ' ')
                    continue;
                tmp = substring(item.content, from, undefined, true);
                if (tmp.indexOf('>') < tmp.indexOf('<'))
                    continue;
                break;
            }

            to = firstMatchAt + EXCERPT_LENGTH;
            for (to; to < item.content.length; to++) {
                if (charAt(item.content, to, true) !== ' ')
                    continue;
                tmp = substring(item.content, 0, to, true);
                if (tmp.lastIndexOf('>') < tmp.lastIndexOf('<'))
                    continue;
                break;
            }

            item.content =
                (from > 0 ? '... ' : '') +
                (function safeHtml(code) {
                    let parser = new DOMParser(),
                        doc = parser.parseFromString(code, 'text/html');

                    return doc.body.innerHTML;
                })(substring(item.content, from, to, EXCERPT_HTML)) +
                (to < item.content.length - 1 ? ' ...' : '');

            item.class_content = !JXG.exists(item.content, true) ? 'off' : '';

            switch (item.type) {
                case 'categorylist':
                    item.subtitle = 'News Category';
                    break;
                case 'taglist':
                    item.subtitle = 'News Tag';
                    break;
                case 'post':
                    item.subtitle = 'News Post (' + item.date_formatted + ')';
                    break;
                case 'site':
                    if (JXG.exists(item.external_link, true)) {
                        item.subtitle = 'External Link';
                        break;
                    }
                default:
                    item.subtitle = '';
            }
            item.class_subtitle = !JXG.exists(item.subtitle, true) ? 'off' : '';

            if (JXG.exists(item.external_link, true)) {
                item.link = item.external_link;
                item.target = '_blank';
                item.linkpostfix = '<i class="fa-solid fa-arrow-up-right-from-square icon-external-link"></i>';
            } else {
                item.link = '{{ relBase }}' + item.url;
                item.target = '_self';
                item.linkpostfix = '';
            }

            RES.append(JXG.website.renderTemplate('template_result', item));
        });
    }
</script>
{% endif %}
