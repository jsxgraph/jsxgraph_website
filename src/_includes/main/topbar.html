{%- assign splash = include.splash | default: false -%}

<header class="position-{% if splash == true %}fixed{% else %}sticky{% endif %} top-0 start-0 end-0 p-3 z-index-outer {% if splash == true %}topbar-splash{% else %}mb-4{% endif %}" id="topbar">
    <div class="d-flex justify-content-between align-items-center">
        <a class="d-flex align-items-center" href="{{ relBase }}">
            <div class="d-inline my-n2 py-2 me-2">
                <div class="d-inline topbar-nosplash">
                    <img class="d-inline d-sm-none h-fix-md w-auto" src="{{ relBase }}/media/logos/logo-sm.png"/>
                    <img class="d-none d-sm-inline h-fix-md w-auto" src="{{ relBase }}/media/logos/logo.png"/>
                </div>
                <div class="d-inline topbar-onlysplash">
                    <img class="d-none d-md-inline h-fix-md w-auto" src="{{ relBase }}/media/logos/logo-sm.png"/>
                </div>
            </div>
            <div class="d-inline text-primary">
                {{ const.version }}
            </div>
        </a>
        <div></div>
        <div class="d-flex align-items-center">
            <nav class="navbar navbar-expand m-0 p-0">
                <ul class="navbar-nav m-0 p-0 d-flex m-between-3 m-between-lg-4">

                    <li class="nav-item d-flex align-items-center" style="font-size: 0; /* for vertical alignment */">
                        <a class="github-button d-block" href="https://github.com/jsxgraph/jsxgraph"
                           data-color-scheme="no-preference: light; light: light; dark: dark;"
                           data-size="large" data-show-count="true" aria-label="Star jsxgraph/jsxgraph on GitHub">Star on GitHub</a>
                        <script async defer src="https://buttons.github.io/buttons.js"></script>
                    </li>

                    {% if page.dir != const.search.url %}
                    <li class="nav-item d-flex align-items-center">
                        <div class="topbar-nosplash d-none d-md-block">
                            {% include part/search.html %}
                        </div>
                        <a class="topbar-nosplash d-block d-md-none nav-link" href="{{ relBase }}{{ const.search.url }}">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </a>
                        <a class="topbar-onlysplash nav-link" href="{{ relBase }}{{ const.search.url }}">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </a>
                    </li>
                    {% endif %}

                    <li class="nav-item" id="menu-toggler-container">
                        <div class="nav-link cursor-pointer" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-controls="menu" id="menu-toggler">
                            <i class="fa-solid fa-bars-staggered"></i>
                            <span class="d-none d-md-inline ms-2">
                                {{ const.btn.menu }}
                            </span>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</header>

{%- if splash == true -%}
<script type="module">
    const THRESHOLD = $('#splash').height() - $('#splash-image').height() - $('#topbar').outerHeight();
    $(document).on('scroll', function () {
        $('#topbar').toggleClass('topbar-splash', $(this).scrollTop() < THRESHOLD);
    }).trigger('scroll');
</script>
{%- endif -%}
