  js: https://jsxgraph.uni-bayreuth.de/distrib/jsxgraphcore.js
  css: https://jsxgraph.uni-bayreuth.de/distrib/jsxgraph.css

default_polygon: "jsxgraph-pure"  # jsxgraph-pure | jsxgraph-plain | circle | 4 | 5 | 6 | 8

meta: >
  JSXGraph is a powerful cross-platform library for interactive geometry, function plotting, and data visualization in the web browser. 

keywords: >
  interactive geometry, dynamic mathematics, visualization, web-based graphics, mathematical constructions, function plotting, data visualization, accessibility, ARIA support, keyboard interaction, touch interaction, screen reader compatibility, open-source software, JavaScript library, STEM education, inquiry-based learning, cross-platform support, educational technology

btn:
  menu: Menu

search:
  label: Search
  placeholder: Type to search
  url: /search/

  # 0 means: exact matches only.
  # 0.6 is the default.
  # 0.2–0.3 is often a good value for “normal” full-text searches: tolerant enough for typos, but not so vague that everything matches.
  # If you want true fuzzy search with many hits (even with significant deviations), go for 0.4–0.5.
  threshold: 0.2

  # 2 is practical so that everything doesn't crash when you enter something like “a.”
  # 3 is even more robust against unnecessary noise.
  # 4 only if you have a very large amount of data and want to avoid junk hits.
  min_char: 3

  # highlighting
  excerpt: 500
  excerpt_html: true
  highlight_match_length_difference: 90%
  highlight_class: text-primary fw-little-bold

cookie:
  hint: >
    JSXGraph stores only essential data for core website functionality in your browser.
  more: Learn more.
  btn: Okay
  link: /privacy

maps:
  button: Load Google Maps
  text: >
    You can view the location via Google Maps.
    When you load the map, personal data will be sent to Google, and cookies will be set by Google.
    Therefore, it is possible that the provider stores your access and analyzes your behavior.
    You can find Google Maps' privacy policy
    <a href="https://policies.google.com/privacy" target="_blank" title="https://policies.google.com/privacy">here</a>.

